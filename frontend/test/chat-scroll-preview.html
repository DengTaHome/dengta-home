<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>聊天滚动回归预览</title><div id="controls"><button id="open">重新进入聊天</button><button id="load">异步加载长历史</button><button id="grow">追加回复</button><button id="resize">模拟键盘</button><button id="measure">检查位置与样式</button><output id="result"></output></div><main class="main-panel view-chat" style="position:relative;width:390px;height:620px;margin:12px auto;display:flex;flex-direction:column;overflow:hidden"><div class="private-chat-background" style="position:absolute;background:linear-gradient(30deg,#c8ddbd,#e2c4dd);"><img alt="" src="/assets/moments-paper-banner.webp"></div><section class="message-list" tabindex="0" aria-label="测试聊天记录" style="overflow:auto;flex:1;min-height:0;padding:12px"><div class="message-list-content"></div></section></main><script type="module">
import '/src/index.css';import '/src/cozy-theme.css';import '/src/native-feel.css';import '/src/apple-ui.css';import '/src/sun-glass-ui.css';import '/src/jelly-motion.css';import '/src/sun-glass-chat.css';import '/src/typography.css';import '/src/apple-high.css';
import {createChatScrollController} from '/src/chat-scroll-controller.js';
const list=document.querySelector('.message-list'), content=list.firstElementChild, following={current:true};
let count=0,controller=createChatScrollController(list,following);
function add(n){for(let i=0;i<n;i++){const row=document.createElement('article');row.className='message-row '+(count%2?'user':'assistant');const avatar=document.createElement('span');avatar.className='message-avatar message-avatar-letter';avatar.textContent=count%2?'我':'灯';const column=document.createElement('div');column.className='message-column';const bubble=document.createElement('div');bubble.className='message-bubble';bubble.textContent=`第 ${++count} 条记录。`+'一起去看看今天的云，回来记录沿途的小发现。'.repeat(count%7+1);column.append(bubble);row.append(avatar,column);content.append(row);}}
function measure(){const row=content.lastElementChild;document.querySelector('#result').textContent=JSON.stringify({messages:count,distance:Math.round(list.scrollHeight-list.clientHeight-list.scrollTop),following:following.current,scroll:getComputedStyle(list).scrollBehavior,animation:getComputedStyle(list).animationName,rowVisibility:row&&getComputedStyle(row).contentVisibility,bubbleBlur:row&&getComputedStyle(row.querySelector('.message-bubble')).backdropFilter});}
document.querySelector('#open').onclick=()=>{controller.dispose();controller=createChatScrollController(list,following);requestAnimationFrame(measure);};
document.querySelector('#load').onclick=()=>{content.replaceChildren();count=0;controller.open();setTimeout(()=>{add(90);requestAnimationFrame(()=>requestAnimationFrame(measure));},180);};
document.querySelector('#grow').onclick=()=>{add(1);controller.sync();requestAnimationFrame(measure);};
document.querySelector('#resize').onclick=()=>{document.querySelector('main').style.height='400px';requestAnimationFrame(()=>requestAnimationFrame(measure));};
document.querySelector('#measure').onclick=measure;add(50);controller.sync();measure();
</script><style>#controls{position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:#fff}#result{display:block;width:100%;font:13px monospace;overflow-wrap:anywhere}body{overflow:auto!important}main{border:1px solid #ccc;border-radius:18px}.message-list{z-index:1}</style></html>
