name: iOS simulator build

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    # Fictional public values for compilation only; no live authentication.
    env:
      VITE_API_URL: https://ios-ci.dengta.invalid
      VITE_SUPABASE_URL: https://ios-ci.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci_build_not_for_auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run ios:prepare
      - run: npm run test:ios
      - name: Build unsigned simulator app
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/dengta-ios"
          CODE_SIGNING_ALLOWED=NO build
