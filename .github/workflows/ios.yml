name: iOS simulator build

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    # Fictional public values for compilation only; no live authentication.
    env:
      VITE_API_URL: https://ios-ci.dengta.invalid
      VITE_SUPABASE_URL: https://ios-ci.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci_build_not_for_auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: xcodebuild -version
      - name: Test native Keychain policy and failure handling
        run: bash scripts/test-ios-keychain-native.sh
      - name: Test native per-account encryption and isolation
        run: bash scripts/test-ios-account-vault-native.sh
      - run: npm ci
      - run: npm run ios:prepare
      - run: npm run test:ios
      - name: Verify account lifecycle and private cache isolation
        env:
          IOS_SECURITY_OUTPUT: artifacts/ios-security
        run: npm run test:ios:security
      - name: Build unsigned simulator app
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/dengta-ios"
          CODE_SIGNING_ALLOWED=NO build
      - name: Capture native iPhone layout evidence
        timeout-minutes: 45
        run: >-
          bash scripts/capture-ios-simulator-layout.sh
          "$RUNNER_TEMP/dengta-ios/Build/Products/Debug-iphonesimulator/App.app"
          artifacts/ios-layout
      - name: Upload native iPhone screenshots and capture metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-layout-${{ github.run_id }}
          path: frontend/artifacts/ios-layout/
          if-no-files-found: error
          retention-days: 14
      - name: Upload account security test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-account-security-${{ github.run_id }}
          path: frontend/artifacts/ios-security/
          if-no-files-found: error
          retention-days: 14
