name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  public-release-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public release contents
        shell: powershell
        run: .\scripts\public-release-audit.ps1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - run: npm ci
      - if: matrix.component == 'frontend'
        name: Install sibling backend dependencies used by integration tests
        run: npm ci --prefix ../backend
      - run: npm test
      - if: matrix.component == 'frontend'
        name: Verify frontend and backend integrations
        run: npm run test:backend-integration
      - if: matrix.component == 'frontend'
        run: npm run build
      - if: matrix.component == 'frontend'
        run: npm run lint
      - run: npm run typecheck
      - if: matrix.component == 'backend'
        run: npm run check
      - if: matrix.component == 'backend'
        name: Replay all migrations into an embedded database
        run: npm run audit:migrations
